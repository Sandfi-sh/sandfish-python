[project]
name = "sandfish-sdk"
version = "0.1.0"
description = "Official Python SDK for the Sandfish web and email analysis API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sandfish", email = "contact@sandfi.sh"}]
keywords = ["sandfish", "phishing", "security", "openapi", "sdk"]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.11,<3",
  "python-dateutil>=2.8.2,<3",
  "typing-extensions>=4.7.1,<5",
]

[project.urls]
Homepage = "https://sandfi.sh"
Documentation = "https://sandfi.sh/docs#api"
Repository = "https://github.com/sandfi-sh/sandfish-python"
Issues = "https://github.com/sandfi-sh/sandfish-python/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "build>=1.2,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandfish_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/sandfish_sdk/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
